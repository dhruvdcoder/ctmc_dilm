# @package _global_
defaults:
  - text_idlm
  - override /datamodule: owt_idlm
  

per_device_batch_size: 32
global_batch_size: 512
block_size: 1024
num_dataloader_workers: 5
monitored_metric: val/lm/accumulated_loss

# override from model_type
global_components:
  noise_schedule:
    _target_: idlm.noise_schedule.LogLinearNoiseSchedule
    sigma_max: 3000
    sigma_min: 50   #  specific for owt
    eps: 1e-4

loss:
  length_loss_weight: 0.001
  ce_weight: 0.001



trainer:
  max_steps: 1000_000 # 1M
  val_check_interval: 50000
  check_val_every_n_epoch: null
  num_sanity_val_steps: 3
  gradient_clip_val: 0.5


optimizer:
  lr: 0.00001
  weight_decay: 0.03
  eps: 5e-6


lr_scheduler:
  name: "cosine_with_min_lr" 
  min_lr: 1e-6
  num_warmup_steps: 2000
  num_training_steps: ${trainer.max_steps}
  num_cycles: 4.0
  monitor: "train/loss"


predictor:
  sampling_method: sample_top_p
  p: 0.9
  second_sampling_method: sample_top_k
  second_top: 1


callbacks:
  checkpoint_every_n_steps:
    every_n_train_steps: 2500
    keep_multiple: 40 # Keep every (keep_multiple * every_n_train_steps) permanently = 2500 * 40 = 100_000